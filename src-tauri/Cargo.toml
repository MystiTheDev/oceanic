[package]
name = "oceanic"
version = "3.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oceanic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
dunce = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }
spake2 = "0.4.0"
snow = "0.10.0"
mdns-sd = "0.22.0"
rand = "0.8"
yrs = "0.28.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# trash has no Android/iOS backend; docs_trash only calls it on desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"
tauri-plugin-autostart = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Antimalware", "Win32_Storage_FileSystem"] }
