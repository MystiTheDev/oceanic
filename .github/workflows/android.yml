# One release for desktop and Android: pushing a `vX.Y.Z` tag runs this next to
# release.yml and uploads the APK into that vX.Y.Z release. The phone updater
# reads v* releases. An `android-v*` tag is only for the one-off bridge APK
# (e.g. android-v2.0.10): a locked build that tells older phones to
# install this commit's version. Never marked "latest".
# Secrets: ANDROID_KEYSTORE (base64 of the .jks), ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Write signing key
        working-directory: src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > keystore.properties

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF_NAME" == android-v* ]]; then
            # Bridge points at this commit's version (the release old phones must upgrade to).
            export VITE_BRIDGE="$(node -p "require('./package.json').version")"
            npx tauri android build --apk --target aarch64 --config "{\"version\":\"${GITHUB_REF_NAME#android-v}\"}"
          else
            npx tauri android build --apk --target aarch64
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-}"; version="${version#v}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          cp "$apk" "Oceanic_${version}_android_arm64.apk"
          if [[ "$GITHUB_REF_NAME" == android-v* ]]; then
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" "Oceanic_${version}_android_arm64.apk" --title "Oceanic Android v${version} (upgrade notice)" --notes "Upgrade notice for phones on v2.0.9 or older. Install the latest Oceanic from the main release." --latest=false
            exit 0
          fi
          # Attach the APK to the main vX.Y.Z release (desktop draft from release.yml).
          for i in $(seq 1 60); do
            gh release upload "v${version}" "Oceanic_${version}_android_arm64.apk" --clobber && exit 0
            sleep 30
          done
          echo "::error::v${version} release not found; APK not published"
          exit 1
