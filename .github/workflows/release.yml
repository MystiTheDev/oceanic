name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Create the draft once, so the 3 desktop jobs and android.yml all fill the same release.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "Oceanic $GITHUB_REF_NAME" --notes ""

  release:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          # Take the "# ... vX.Y.Z ..." section of RELEASE_NOTES.md, up to the next "# " heading.
          awk -v tag="${GITHUB_REF_NAME}" '
            /^# / { if (found) exit; if (index($0, tag)) { found = 1; next } }
            found { print }
          ' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '# ... ${GITHUB_REF_NAME}' section found in RELEASE_NOTES.md"
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Oceanic ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ runner.os }}
        run: |
          mkdir -p checksums
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --dir checksums --pattern '*' --clobber
          node - <<'NODE'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const dir = 'checksums';
          const files = fs.readdirSync(dir).filter((f) => /\.(exe|dmg|AppImage|deb|rpm|msi|zip|tar\.gz)$/i.test(f)).sort();
          const lines = files.map((f) => `${crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, f))).digest('hex')}  ${f}`);
          fs.writeFileSync(`SHA256SUMS-${process.env.PLATFORM}.txt`, lines.join('\n') + '\n');
          NODE
          gh release upload "$GITHUB_REF_NAME" "SHA256SUMS-${PLATFORM}.txt" -R "$GITHUB_REPOSITORY" --clobber
