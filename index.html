<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Oceanic</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("oceanic.theme") || "dark";
      } catch {}
      // Desktop app: start transparent; Rust adds .oc-reveal when the window is shown.
      if (window.__TAURI_INTERNALS__) document.documentElement.classList.add("oc-boot");
    </script>
    <style>
      html.oc-boot #root { opacity: 0; transform: scale(0.985); }
      html.oc-boot.oc-reveal #root {
        opacity: 1;
        transform: none;
        transition: opacity 600ms ease, transform 700ms cubic-bezier(0.2, 0.7, 0.3, 1);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
